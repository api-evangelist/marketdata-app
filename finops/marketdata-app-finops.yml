description: >-
  FinOps view of Market Data spend. Market Data is a SaaS market-data API billed
  on a subscription plan that grants a daily (or per-minute) allocation of API
  credits. The dominant cost driver is credit consumption: every call spends at
  least one credit, and multi-symbol responses - bulk quotes, bulk candles, and
  especially large options chains - spend one credit per symbol returned. Cost
  is therefore controlled less by request count than by how wide each response
  is. Plans range from Free Forever through Starter, Trader, Quant, and Prime,
  with a 30-day trial up front.
notes: >-
  The single largest optimization lever is filtering options chains (by
  expiration, strike range, side, or moneyness) so responses return fewer
  contracts and consume fewer credits. Verify per-plan credit allowances and
  prices on the Market Data pricing page during reconciliation.
