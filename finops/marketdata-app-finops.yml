meters:
- name: api_credits
  description: API credits consumed by successful requests; one credit per request minimum, one per symbol on multi-symbol responses.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - endpoint
  - plan
- name: symbols_returned
  description: Count of symbols in multi-symbol responses (bulk quotes, bulk candles, options chains), each of which spends a credit.
  unit: symbols
  aggregation: sum
  dimensions:
  - account
  - endpoint
- name: subscription_fee
  description: Recurring plan subscription charge (Starter, Trader, Quant, Prime).
  unit: months
  aggregation: sum
  dimensions:
  - account
  - plan
principles:
- name: Visibility
  description: Track daily credit burn against the plan allowance and attribute it per endpoint; watch options-chain calls, which can spend thousands of credits each.
- name: Allocation
  description: Map API tokens or accounts to workloads/teams so credit consumption and the monthly subscription map to internal cost centers.
- name: Optimization
  description: Filter options chains and use single-symbol quotes over broad bulk requests where possible; right-size the plan (Free/Starter/Trader daily cap vs Quant/Prime per-minute) to the actual burn pattern.
- name: Accountability
  description: Review monthly credit usage against the chosen plan and downgrade or upgrade tiers as the daily/per-minute burn stabilizes.
