aid: marketdata-app
url: https://raw.githubusercontent.com/api-evangelist/marketdata-app/refs/heads/main/apis.yml
name: Market Data
kind: company
description: >-
  Market Data (marketdata.app) is a financial market data provider offering a
  REST API for real-time and historical U.S. stock, options, and index data.
  The API (base https://api.marketdata.app/v1, Bearer-token authenticated)
  covers stock candles and quotes - single and bulk - plus earnings and news;
  full options chains with per-contract quotes, expirations, strikes, and OCC
  symbol lookup; index candles and quotes; and market open/closed status.
  Responses are JSON or CSV and are billed on a daily API-credit model, where
  multi-symbol responses (bulk quotes, options chains) consume one credit per
  symbol. A 30-day trial, a Free Forever tier, and paid Starter, Trader, and
  Prime plans are available. Note that the API may return HTTP 203 from its
  caching tier and clients must treat it as success.
